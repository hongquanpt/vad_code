SYSTEM:
  phase: 'train'
  device: "cuda:0" # "cuda:0"; "cuda:1"; "cpu"
  cudnn:
    benchmark: true
    deterministic: false
    enable: true
  output:
    log_dir: 'log'
    tesorboard_dir: 'tensorboard'
    checkpoint_dir: 'checkpoint'
    visualization_dir: 'visualization'
  neptune:
    use: true
DATASET:
  name: 'shanghaitech'
  
  read_format: 'PIL' # opencv
  image_format: 'jpg'
  
  width: 256
  height: 256
  channel: 3
  normalized: true
  
  num_frames: 5 # 5 for prediction, 1 for reconstruction
  frame_steps: 1
  clip_mode: 'cat' # cat, stack, list
  clip_dim: 0
  skip_frames: [2,3,4,5]
  
  train:
    train_set: 'training'
    batch_size_per_gpu: 4
    shuffle: true
    num_workers: 4
    pin_memory: false
    drop_last: true
    sample_type: 'clips' #  'videos', 'clips', 'clips_by_video'
    # 'training_keyframes_DeepKmean_0.30'; 
    # 'training_keyframes_op_0.30'
    # 'training_keyframes_Entropy_0.30'
    keyframes_dir: 'training_keyframes_op_0.30'
    
  test:
    test_set: 'testing'
    batch_size_per_gpu: 1
    shuffle: false
    num_workers: 4
    pin_memory: false
    drop_last: false
    gt_filename: 'frame_labels_shanghai.npy'
    sample_type: 'videos' # videos', 'clips_by_video'
    
MODEL:
  name: 'PAMAE5'
  type: 'prediction'
  
TRAIN:
  name: 'pamae_trainer'
  begin_epoch: 0
  end_epoch: 10
  save_freq: 1
  resume: true # false, true
  dir_name: 'session_2024_01_05_09_37'
  file_name: 'epoch_4.pth'

  optimizer:
    name: 'Adam'
    lr: 2e-4  #0.0002
    betas: [ 0.9, 0.999 ]
    eps: 1e-8
    weight_decay: 0.0  # Adam, SGD, RMSprop

    momentum: 0.0  # SGD, RMSprop
    nesterov: false  # SGD
    rmsprop_alpha: 0.99  # RMSprop
    rmsprop_centered: false  # RMSprop
    
  lr_scheduler:
    use: true
    name: 'CosineAnnealingLR'
    step_size: 20 # for StepLR
    milestones: [20, 40] # for MultiStepLR
    gamma: 0.1  # for StepLR, MultiStepLR
    eta_min: 0.0 # Minimum learning rate for 'CosineAnnealingLR'
  
  other_params:
    feature_dim: 512
    memory_dim: 512
    memory_size: 10
    
    skip_frames_prob: 0.01
    loss_compact: 0.1
    loss_separate: 0.1
    print_seq: 1000
TEST:
  name: 'pamae_tester'
  dir_name: 'session_2023_12_27_16_56'
  # Deep K-mean: session_2023_12_11_23_34: p=0.002;bz=4,epoch=10, 
  # Deep K-mean: session_2023_12_11_23_34: p=0.002;bz=4,epoch=9, 

  
  # Deep K-mean: session_2023_12_27_16_56: p=0.01,bz=4,epoch=10, Best AUC=71.48 alpha=0.4
  # Deep K-mean: session_2023_12_27_16_56: p=0.01,bz=4,epoch=9, Best AUC=71.23 alpha=0.3  
  file_name: 'epoch_9.pth'
  train_batch_size_per_gpu: 4
    #======================================================================================
    # PAMAE5-shanghaitech: skip_frame_prob=0.002; keyframes=0.3; epochs=10
    #======================================================================================
    #'./output/train/PAMAE5/shanghaitech/001_0.002_10_2023_12_11_23_34/checkpoint/epoch_10.pth',
    #  69.80(1.0), 69.82(0.9), 69.82(0.8), 69.81(0.7), 69.79(0.6), 69.78(0.5),  69.76(0.4),  69.73(0.3),  69.69(0.2), 69.61(0.1),  63.32(0.0)

  other_params:
    ano_score_alpha: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0]
    update_threshold: 0.01

