SYSTEM:
  phase: 'train'
  loop_index: 1
  device: "cuda:1" # "cuda:0"; "cuda:1"; "cpu"
  cudnn:
    benchmark: true
    deterministic: false
    enable: true
  output:
    log_dir: 'log'
    tesorboard_dir: 'tensorboard'
    checkpoint_dir: 'checkpoint'
    visualization_dir: 'visualization'
DATASET:
  name: 'ped2'
  
  read_format: 'PIL' # opencv
  image_format: 'jpg'
  
  width: 64 # 256, 64
  height: 64 # 256, 64
  channel: 3
  
  num_frames: 5
  frame_steps: 1
  lower_bound: 100
  
  z_dim: 512
  h_dim: 512  # for LSTM hidden
  
  train:
    trainset: 'training'
    batch_size_per_gpu: 4
    shuffle: true
    num_workers: 4
    pin_memory: false
    drop_last: true

  test:
    testset: 'testing'
    batch_size_per_gpu: 1
    shuffle: false
    num_workers: 4
    pin_memory: false
    drop_last: false
    gt_filename: 'ped2.mat'
    
MODEL:
  name: 'VideoVAE'
  type: 'reconstruction'
  
TRAIN:
  name: 'VideoVAE_trainer'
  begin_epoch: 0
  end_epoch: 1000
  save_freq: 100
  resume: false # false, true
  checkpoint_filepath: './output/train/MNAD/ped2/001-2023-08-07-18-31/checkpoint/final.pth'
  
  losses: ['loss_RecLoss_cuda', 1, 'L2Loss', [], 
          'loss_MemLoss_cuda', 0.0002, 'MemLoss', []]
  
  optimizer:
    name: 'Adam'
    learning_rate: 1e-4
    
  lr_scheduler:
    use: true
    name: 'MultiStepLR'
    step_size: 1000
    steps: [63800, 127600]
    gamma: 0.1
  
  other_params:
    feature_dim: 512
    memory_dim: 512
    memory_size: 10
    skip_frames: (2,3,4,5)
    skip_frames_prob: 0.01
    patch_prob: 0.01
    noise_prob: 0.0
    fusion_prob: 0.0
    loss_compact: 0.0
    loss_separate: 0.0
  
TEST:
  name: 'VideoVAE_tester'
  checkpoint_filepaths: [
  # skip_frames_prob: 0.01
  # patch_prob: 0.01
      './output/train/PAMAE2/ped2/001-0.01-2023-08-08-23-29/checkpoint/epoch_50.pth', # 92.88% (1.0)
      './output/train/PAMAE2/ped2/001-0.01-2023-08-08-23-29/checkpoint/epoch_45.pth', # 93.53% (1.0)
                
      './output/train/PAMAE2/ped2/002-0.01-2023-08-09-00-32/checkpoint/epoch_50.pth', # 93.74% (0.8)
      './output/train/PAMAE2/ped2/002-0.01-2023-08-09-00-32/checkpoint/epoch_45.pth', # 94.78% (0.8)
                
      './output/train/PAMAE2/ped2/003-0.01-2023-08-09-01-35/checkpoint/epoch_50.pth', # 93.33% (1.0)
      './output/train/PAMAE2/ped2/003-0.01-2023-08-09-01-35/checkpoint/epoch_45.pth', # 93.54% (0.9)
                
      './output/train/PAMAE2/ped2/004-0.01-2023-08-09-02-39/checkpoint/epoch_50.pth', # 92.42% (0.8)
      './output/train/PAMAE2/ped2/004-0.01-2023-08-09-02-39/checkpoint/epoch_45.pth', # 93.84% (0.8)
                
      './output/train/PAMAE2/ped2/005-0.01-2023-08-09-03-42/checkpoint/epoch_50.pth', # 87.98% (0.9)
      './output/train/PAMAE2/ped2/005-0.01-2023-08-09-03-42/checkpoint/epoch_45.pth', # 95.82% (0.9)
                          ]
  other_params:
    ano_score_alpha: [0.6, 0.7, 0.8, 0.9, 1.0]
    update_threshold: 0.01

