SYSTEM:
  phase: 'train'
  device: "cuda:0" # "cuda:0"; "cuda:1"; "cpu"
  cudnn:
    benchmark: true
    deterministic: false
    enable: true
  output:
    log_dir: 'log'
    tesorboard_dir: 'tensorboard'
    checkpoint_dir: 'checkpoint'
    visualization_dir: 'visualization'
DATASET:
  name: 'ped2'
  
  read_format: 'PIL' # opencv
  image_format: 'jpg'
  
  width: 192
  height: 128
  channel: 3
  normalized: true
  
  num_frames: 2 # 5 for prediction, 1 for reconstruction
  frame_steps: 1
  clip_mode: 'cat' # cat, stack, list
  clip_dim: 0
  skip_frames: [2,3,4,5]
  
  train:
    train_set: 'training'
    batch_size_per_gpu: 2
    shuffle: true
    num_workers: 4
    pin_memory: false
    drop_last: true
    sample_type: 'clips' #  'videos', 'clips', 'clips_by_video'

  test:
    test_set: 'testing'
    batch_size_per_gpu: 1
    shuffle: false
    num_workers: 4
    pin_memory: false
    drop_last: false
    gt_filename: 'ped2.mat'
    sample_type: 'videos' # videos', 'clips_by_video'
    
MODEL:
  name: 'AMC'
  type: 'prediction'
  flownet: 'liteflownet' # 'flownet2', 'liteflownet'
  #flow_model_path: './libs/flownet2/weights/FlowNet2_checkpoint.pth.tar'
  flow_model_path: './libs/liteflownet/weights/network-sintel.pytorch'
TRAIN:
  name: 'amc_trainer'
  begin_epoch: 0
  end_epoch: 16 # ped2: 16, avenue: 8
  save_freq: 6
  resume: false # false, true
  dir_name: 'session_2023_12_04_19_45_45'  # 'session_2023_12_25_22_44_1'
  file_name: 'epoch_45.pth'  # 'epoch_1.pth'
  
  optimizer:
    name: 'Adam'
    lr: 2e-4  #0.0002
    betas: [0.5, 0.9]
    eps: 1e-8
    weight_decay: 0.0001  # Adam, SGD, RMSprop

    momentum: 0.0  # SGD, RMSprop
    nesterov: false  # SGD
    rmsprop_alpha: 0.99  # RMSprop
    rmsprop_centered: false  # RMSprop

    g_lr: 0.0002
    d_lr: 0.00002
    
  lr_scheduler:
    use: false
    name: 'StepLR'
    step_size: 320 # for StepLR
    milestones: [20, 40] # for MultiStepLR
    gamma: 0.1  # for StepLR, MultiStepLR
    eta_min: 0.0 # Minimum learning rate for 'CosineAnnealingLR'
  
  other_params:
    feature_dim: 512
    memory_dim: 512
    memory_size: 10
    
    skip_frames_prob: 0.002
    loss_compact: 0.1
    loss_separate: 0.1
    print_seq: 1000
TEST:
  name: 'amc_tester'
  dir_name: 'session_2023_12_04_19_45_45'  # 'session_2023_12_25_22_44_1'
  file_name: 'epoch_45.pth'  # 'epoch_1.pth'


