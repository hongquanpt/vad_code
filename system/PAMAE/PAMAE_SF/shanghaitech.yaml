SYSTEM:
  phase: 'train'
  num_run: 1
  device: "cuda:0" # "cuda:0"; "cuda:1"; "cpu"
  gpus: [0, 1]
  cudnn:
    benchmark: true
    deterministic: false
    enable: true
  output:
    log_dir: 'log'
    tesorboard_dir: 'tensorboard'
    checkpoint_dir: 'checkpoint'
    visualization_dir: 'visualization'
  neptune:
    use: true
DATASET:
  name: 'shanghaitech'
  
  read_format: 'PIL' # PIL, CV2
  image_format: 'jpg'
  
  width: 256
  height: 256
  channel: 3
  normalized: true
  
  num_frames: 5 # 5 for prediction, 1 for reconstruction
  frame_steps: 1
  # (3,256,256) => cat => (15,256,256)
  # (3,256,256) => stack => (5,3,256,256)
  clip_mode: 'cat' # cat, stack, list
  clip_dim: 0

  dict_sf:
    p: 0.01  # xac suat skip_frames: 0.01, 0.005
    s: [2,3,4,5]  # so luong skip_frames, lay ngau nhien trong [2,..5]

  dict_kf:
    p: 0.0  # xac suat key_frames: 0.01, 0.005

  dict_patch:
    p: 0.0  # xac suat add patch vao frames
    alpha: 0.5  # control the maximum size of the patch relative to the frame size: posW and posH= random in [10,alphaW] and [10,alphaH]
    beta: 25  # adjust the maximum movement of the patch in terms of pixels: new_pos= (center_pos + random in [-beta,beta]) 
    technique: 'SmoothMixS'
    intruder: 'CIFAR-100'

  dict_shake:
    p: 0.0  # xac suat rung lac camera
    rot: [1,3]  # degree for rotation
    trans: [0.01,0.02]  # percentage pixels for translation
  
  train:
    train_set: 'training'
    batch_size_per_gpu: 4
    shuffle: true
    num_workers: 4
    pin_memory: false
    drop_last: true
    sample_type: 'clips' #  'videos', 'clips', 'clips_by_video'
    # training_KF_OF_30: 'training_keyframes_op_0.30'
    # training_KF_KM_30: 'training_keyframes_DeepKmean_0.30';
    # training_KF_GA_30: 'training_keyframes_Entropy_0.30'
    # training_KF_ES_30: (key frames with entropy sorted)
    # training_KF_EM: (key frames with entropy medium)
    # training_KF_EN: (key frames with entropy medium no adjacent)
    keyframes_dir: 'training_KF_OF_30'

  test:
    test_set: 'testing'
    batch_size_per_gpu: 1
    shuffle: false
    num_workers: 4
    pin_memory: false
    drop_last: false
    gt_filename: 'frame_labels_shanghai.npy'
    sample_type: 'videos' # videos', 'clips_by_video'
    
MODEL:
  name: 'PAMAE'
  type: 'prediction'
  method: 'PAMAE_SF'
  # PAMAE_SF (Skip Frames): p_sf=0.01
  # PAMAE_KF_OF (Key Frames with Optical Flow): p_kf=0.01
  # PAMAE_KF_KM (Key Frames with K-Mean)
  # PAMAE_KF_GA (Key Frames with Entropy GA)
  # PAMAE_KF_ES (Key Frames with Entropy Sorted)
  # PAMAE_KF_EM (Key Frames with Entropy Medium)
  # PAMAE_KF_EN (Key Frames with Entropy medium No adjacent)
  # PAMAE_SF_SK (Skip Frames with Camera Shake)
  # PAMAE_SF_KF_OF (Skip Frames with Key Frames): p_sf=0.005, p_kf=0.005
  # PAMAE_SF_KF_MultiLoss (Skip Frames with Multiple Losses)
  
TRAIN:
  name: 'pamae_trainer'
  begin_epoch: 0
  end_epoch: 10
  save_freq: 1
  resume: false # false, true
  # session_2024_02_20_22_23: epoch_7
  # session_2024_02_22_00_52: epoch_1
  dir_name: 'session_2024_02_22_00_52' # 
  file_name: 'epoch_1.pth'
  
  optimizer:
    name: 'Adam'
    lr: 2e-4  #0.0002
    betas: [ 0.9, 0.999 ]
    eps: 1e-8
    weight_decay: 0.0  # Adam, SGD, RMSprop

    momentum: 0.0  # SGD, RMSprop
    nesterov: false  # SGD
    rmsprop_alpha: 0.99  # RMSprop
    rmsprop_centered: false  # RMSprop
    
  lr_scheduler:
    use: true
    name: 'CosineAnnealingLR'
    step_size: 20 # for StepLR
    milestones: [20, 40] # for MultiStepLR
    gamma: 0.1  # for StepLR, MultiStepLR
    eta_min: 0.0 # Minimum learning rate for 'CosineAnnealingLR'
  
  other_params:
    feature_dim: 512
    memory_dim: 512
    memory_size: 10
    
    loss_compact: 0.1
    loss_separate: 0.1

    loss_type: 'IC' # 'ICS or 'IC' (Intensity, Compact, Separate)
TEST:
  name: 'pamae_tester'
  dir_name: 'session_2024_02_20_22_23'
  file_name: 'epoch_10.pth'
