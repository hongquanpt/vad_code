SYSTEM:
  phase: 'train'
  num_run: 1
  device: "cuda:0" # "cuda:0"; "cuda:1"; "cpu"
  gpus: [0, 1]
  cudnn:
    benchmark: true
    deterministic: false
    enable: true
  output:
    log_dir: 'log'
    tesorboard_dir: 'tensorboard'
    checkpoint_dir: 'checkpoint'
    visualization_dir: 'visualization'
  neptune:
    use: true # true, false
DATASET:
  name: 'shanghaitech'
  
  read_format: 'PIL' # opencv
  image_format: 'jpg'
  
  width: 256
  height: 256
  channel: 3
  normalized: true
  
  num_frames: 5 # 5 for prediction, 1 for reconstruction
  frame_steps: 1
  # (3,256,256) => cat => (15,256,256)
  # (3,256,256) => stack => (5,3,256,256)
  clip_mode: 'cat' # cat, stack, list
  clip_dim: 0

  dict_sf:
    p: 0.002
    s: [2,3,4,5]

  dict_rf:
    p: 0.002
    r: [2,3]

  dict_patch:
    p: 0.002
    alpha: 0.5
    beta: 25
    technique: 'SmoothMixS'
    intruder: 'CIFAR-100'

  dict_fusion:
    p: 0.002

  dict_noise:
    p: 0.002
    sigma: 0.05

  dict_shake:
    p: 0.0
    rot: [1,3]
    trans: [0.01,0.02]
  
  train:
    train_set: 'training'
    batch_size_per_gpu: 4
    shuffle: true
    num_workers: 4
    pin_memory: false
    drop_last: true
    sample_type: 'clips' #  'videos', 'clips', 'clips_by_video'
    keyframes_dir: 'training_KF_GA_30'

  test:
    test_set: 'testing'
    batch_size_per_gpu: 1
    shuffle: false
    num_workers: 4
    pin_memory: false
    drop_last: false
    gt_filename: 'frame_labels_shanghai.npy'
    sample_type: 'videos' # videos', 'clips_by_video'
    
MODEL:
  name: 'PBMAE'
  type: 'prediction'
  method: 'PBMAE'
  
TRAIN:
  name: 'PBMAE_trainer'
  begin_epoch: 0
  end_epoch: 10
  save_freq: 1
  resume: false # false, true
  dir_name: 'session_2023_12_04_19_45_45' 
  file_name: 'epoch_5.pth'

  optimizer:
    name: 'Adam'
    lr: 2e-4  #0.0002
    betas: [0.9, 0.999]
    eps: 1e-8
    weight_decay: 0.0  # Adam, SGD, RMSprop

    momentum: 0.0  # SGD, RMSprop
    nesterov: false  # SGD
    rmsprop_alpha: 0.99  # RMSprop
    rmsprop_centered: false  # RMSprop
    
  lr_scheduler:
    use: true
    name: 'CosineAnnealingLR'
    step_size: 20 # for StepLR
    milestones: [20, 40] # for MultiStepLR
    gamma: 0.1  # for StepLR, MultiStepLR
    eta_min: 0.0 # Minimum learning rate for 'CosineAnnealingLR'
  
  other_params:
    feature_dim: 512
    memory_dim: 512
    memory_size: 10
    
    skip_frames_prob: 0.01 # 0.01
    loss_compact: 0.1
    loss_separate: 0.1
TEST:
  name: 'PBMAE_tester'
  dir_name:  'session_2024_01_10_08_00'
  file_name: 'epoch_45.pth'
  train_batch_size_per_gpu: 4
  psnr_types: ['psnr_1', 'psnr_frame'] # 'psnr_max', 'psnr_frame', 'psnr_1', 'psnr_patch'
  other_params:
    ano_score_alpha: [ 1.0, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1, 0.0 ]
    #ano_score_alpha: [0.8]
    update_threshold: 0.01

    # =================================
    # PBMAE 
    # Thay doi ham loss cho pseudo anomaly: b_loss = torch.mean(-pixel_loss[b])
    # loss = torch.mean(stacked_loss_mse) + loss_compact + loss_separate
    # =================================    
    # session_ : p=0.002,bz=4,epoch=10,s:[2,3,4,5]
 
      